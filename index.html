<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MRP Reorder Calculator</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a2e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  .page-header { background: #1a1a2e; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .page-header h1 { font-size: 15px; font-weight: 700; }
  .page-header a  { color: #7c9dc5; font-size: 11px; text-decoration: none; }

  /* ── App layout ── */
  .app { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar { width: 230px; flex-shrink: 0; background: #fff; border-right: 1px solid #e8eaed; display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-head { padding: 12px 14px 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #aaa; border-bottom: 1px solid #eee; flex-shrink: 0; }
  .comp-list { flex: 1; overflow-y: auto; }
  .comp-item { padding: 9px 14px; cursor: pointer; border-bottom: 1px solid #f5f5f5; display: flex; align-items: center; gap: 8px; }
  .comp-item:hover { background: #f8faff; }
  .comp-item.active { background: #eff6ff; border-left: 3px solid #3b82f6; }
  .comp-item.active .comp-item-name { color: #1d4ed8; }
  .comp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .comp-dot.ok     { background: #22c55e; }
  .comp-dot.warn   { background: #f59e0b; }
  .comp-dot.bad    { background: #ef4444; }
  .comp-dot.na     { background: #d1d5db; }
  .comp-item-name  { font-size: 11px; font-weight: 600; color: #374151; line-height: 1.3; }
  .comp-item-code  { font-size: 9px; color: #9ca3af; }

  /* ── Main panel ── */
  .main-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Component header ── */
  .comp-header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .comp-header-left h2 { font-size: 16px; font-weight: 700; color: #1a1a2e; }
  .comp-header-left .sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .comp-header-right { display: flex; align-items: center; gap: 16px; }
  .meta-field { display: flex; flex-direction: column; align-items: flex-end; }
  .meta-label { font-size: 9px; font-weight: 700; text-transform: uppercase; color: #aaa; margin-bottom: 2px; }
  .meta-input { border: 1px solid #e2e8f0; border-radius: 5px; padding: 3px 7px; font-size: 12px; font-weight: 600; width: 90px; text-align: right; font-family: inherit; outline: none; }
  .meta-input:focus { border-color: #3b82f6; }

  /* ── Table wrapper ── */
  .table-outer { flex: 1; overflow: auto; padding: 0; }

  /* ── MRP table ── */
  .mrp-table { border-collapse: collapse; font-size: 12px; min-width: max-content; }
  .mrp-table th, .mrp-table td { padding: 0; white-space: nowrap; }

  /* Column widths */
  .col-label { width: 200px; min-width: 200px; }
  .col-start { width: 100px; min-width: 100px; text-align: right; }
  .col-month { width: 90px; min-width: 90px; text-align: right; }

  /* Sticky columns */
  .sticky-label { position: sticky; left: 0; z-index: 3; }
  .sticky-start { position: sticky; left: 200px; z-index: 3; }

  /* Header row */
  .mrp-table thead tr th { background: #1a1a2e; color: #cdd; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 8px 10px; border-right: 1px solid #2d3748; }
  .mrp-table thead .sticky-label { background: #1a1a2e; z-index: 4; }
  .mrp-table thead .sticky-start { background: #1a1a2e; z-index: 4; }

  /* Location header rows */
  .row-loc-head td { background: #2d3748; color: #e2e8f0; font-weight: 700; font-size: 12px; padding: 8px 10px; border-right: 1px solid #3d4f63; border-bottom: 1px solid #3d4f63; }
  .row-loc-head .sticky-label { background: #2d3748; z-index: 2; }
  .row-loc-head .sticky-start { background: #2d3748; z-index: 2; }
  .row-loc-head .start-val { font-size: 13px; font-weight: 700; color: #e2e8f0; }

  /* SKU forecast sub-rows */
  .row-sku td { background: #f9fafb; color: #374151; padding: 5px 10px; border-right: 1px solid #eee; border-bottom: 1px solid #f3f4f6; font-size: 11px; }
  .row-sku .sticky-label { background: #f9fafb; z-index: 2; padding-left: 22px; color: #6b7280; font-style: italic; }
  .row-sku .sticky-start { background: #f9fafb; z-index: 2; }

  /* Replenishment row */
  .row-replen td { background: #eff6ff; padding: 4px 6px; border-right: 1px solid #dbeafe; border-bottom: 1px solid #dbeafe; }
  .row-replen .sticky-label { background: #eff6ff; z-index: 2; padding-left: 22px; font-size: 11px; font-weight: 600; color: #1d4ed8; padding-top: 5px; padding-bottom: 5px; }
  .row-replen .sticky-start { background: #eff6ff; z-index: 2; }

  /* Onhand row */
  .row-onhand td { background: #fff; padding: 6px 10px; border-right: 1px solid #eee; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 12px; }
  .row-onhand .sticky-label { background: #fff; z-index: 2; color: #374151; font-size: 11px; font-weight: 700; padding-left: 22px; }
  .row-onhand .sticky-start { background: #fff; z-index: 2; }

  /* Spacer row */
  .row-spacer td { height: 8px; background: #f0f4f8; border: none; }
  .row-spacer .sticky-label, .row-spacer .sticky-start { background: #f0f4f8; }

  /* All Locations block */
  .row-all-head td { background: #1e3a5f; color: #bfdbfe; font-weight: 700; font-size: 12px; padding: 8px 10px; border-right: 1px solid #2d4f7a; border-bottom: 1px solid #2d4f7a; }
  .row-all-head .sticky-label { background: #1e3a5f; z-index: 2; }
  .row-all-head .sticky-start { background: #1e3a5f; z-index: 2; }

  /* Onhand value colors */
  .val-pos { color: #15803d; }
  .val-neg { color: #b91c1c; }
  .val-zero { color: #6b7280; }

  /* Replenishment inputs */
  .rep-input { border: 1px solid #bfdbfe; border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 600; color: #1d4ed8; background: #fff; width: 82px; text-align: right; font-family: inherit; outline: none; }
  .rep-input:focus { border-color: #3b82f6; background: #f0f9ff; }
  .rep-input:hover { border-color: #93c5fd; }

  /* Forecast inputs */
  .fc-input { border: 1px solid transparent; border-radius: 4px; padding: 2px 6px; font-size: 11px; color: #374151; background: transparent; width: 82px; text-align: right; font-family: inherit; outline: none; }
  .fc-input:focus { border-color: #d1d5db; background: #fff; }
  .fc-input:hover { background: #f3f4f6; }

  /* Starting inv inputs */
  .start-input { border: none; background: transparent; font-size: 13px; font-weight: 700; color: #e2e8f0; width: 90px; text-align: right; font-family: inherit; outline: none; padding: 0 10px; }
  .start-input::placeholder { color: #6b7280; font-weight: 400; font-size: 11px; }
  .start-input:focus { background: rgba(255,255,255,0.1); border-radius: 4px; }

  /* Empty state */
  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 13px; }

  /* Upload button */
  .upload-btn { background: #2d4a6b; color: #bfdbfe; border: 1px solid #3b6fa0; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; }

  #invFileInput { display: none; }

  /* Toast */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #e2e8f0; padding: 10px 20px; border-radius: 8px; font-size: 12px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.error { background: #7f1d1d; color: #fecaca; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f1f1f1; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
</style>

function genMonths(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(2026, 3 + i, 1); // Apr 2026 + i
    const label = d.toLocaleDateString('en-US',{month:'short',year:'2-digit'}).replace(' ','-');
    const days  = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    out.push({label, days});
  }
  return out;
}

// ═══════════════════════════════════════════════════
//  Mutable state
// ═══════════════════════════════════════════════════
// startInv[locId][compId] = starting units on hand
let startInv = {};
// fcOverride[locId][skuId][monthIdx] = monthly units (overrides default)
let fcOverride = {};
// replen[locId][compId][monthIdx] = replenishment units
let replen = {};

let selectedCompId = null;

// ═══════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════
function getStart(locId, compId) {
  return ((startInv[locId] || {})[compId]) ?? '';
}
function setStart(locId, compId, val) {
  if (!startInv[locId]) startInv[locId] = {};
  startInv[locId][compId] = val;
}
function getFc(locId, skuId, mIdx) {
  const ov = ((fcOverride[locId] || {})[skuId] || [])[mIdx];
  if (ov !== undefined) return ov;
  const sku = skus.find(s => s.id === skuId);
  if (!sku || !sku.weeklyForecast) return 0;
  return Math.round(sku.weeklyForecast * MONTHS[mIdx].days / 7);
}
function setFc(locId, skuId, mIdx, val) {
  if (!fcOverride[locId]) fcOverride[locId] = {};
  if (!fcOverride[locId][skuId]) fcOverride[locId][skuId] = [];
  fcOverride[locId][skuId][mIdx] = val;
}
function getRep(locId, compId, mIdx) {
  return ((replen[locId] || {})[compId] || [])[mIdx] || 0;
}
function setRep(locId, compId, mIdx, val) {
  if (!replen[locId]) replen[locId] = {};
  if (!replen[locId][compId]) replen[locId][compId] = [];
  replen[locId][compId][mIdx] = val;
}

// Monthly component demand at a location
function compDemand(locId, compId, mIdx) {
  let d = 0;
  skus.filter(s => s.locId === locId).forEach(s => {
    const qty = (bom[s.id] || {})[compId] || 0;
    if (qty) d += getFc(locId, s.id, mIdx) * qty;
  });
  return Math.round(d);
}

// Running onhand array for a location+component
function runningOnhand(locId, compId) {
  let oh = Number(getStart(locId, compId)) || 0;
  return MONTHS.map((_, m) => {
    oh = oh - compDemand(locId, compId, m) + getRep(locId, compId, m);
    return oh;
  });
}

// Format number: parentheses for negative, comma-separated
function fv(n) {
  if (n === '' || n === null || n === undefined) return '';
  const v = Math.round(Number(n));
  if (isNaN(v)) return '';
  if (v === 0) return '0';
  const abs = Math.abs(v).toLocaleString();
  return v < 0 ? `(${abs})` : abs;
}
function valClass(n) {
  if (!n && n !== 0) return '';
  return n > 0 ? 'val-pos' : n < 0 ? 'val-neg' : 'val-zero';
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ═══════════════════════════════════════════════════
//  Component status (for sidebar dot)
// ═══════════════════════════════════════════════════
function compStatus(compId) {
  // Check if any location has projected stockout in first 3 months
  let anyDemand = false;
  let anyBad = false, anyWarn = false;
  locations.forEach(loc => {
    const oh = runningOnhand(loc.id, compId);
    const hasDemand = oh.some((_, m) => compDemand(loc.id, compId, m) > 0);
    if (!hasDemand) return;
    anyDemand = true;
    if (oh.slice(0,3).some(v => v < 0)) anyBad = true;
    else if (oh.slice(0,6).some(v => v < 0)) anyWarn = true;
  });
  if (!anyDemand) return 'na';
  if (anyBad) return 'bad';
  if (anyWarn) return 'warn';
  return 'ok';
}

      <div class="comp-dot ${status}"></div>
      <div>
        <div class="comp-item-name">${esc(c.name)}</div>
        <div class="comp-item-code">${esc(c.code)}</div>
      </div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════
//  Render main panel
// ═══════════════════════════════════════════════════
function selectComp(compId) {
  selectedCompId = compId;
  renderSidebar();
  renderMain();
}

function renderMain() {
  const panel = document.getElementById('mainPanel');
  if (!selectedCompId) {
    panel.innerHTML = '<div class="empty-state">Select a component to view its projection</div>';
    return;
  }
  const comp = components.find(c => c.id === selectedCompId);
  if (!comp) return;

  // Month header columns
  const monthCols = MONTHS.map(m => `<th class="col-month">${m.label}</th>`).join('');

  // Build location blocks
  const locBlocks = locations.map(loc => buildLocBlock(loc, comp)).join('');

  // All Locations block
  const allBlock = buildAllBlock(comp);

  panel.innerHTML = `
    <div class="comp-header">
      <div class="comp-header-left">
        <h2>${esc(comp.name)}</h2>
        <div class="sub">${esc(comp.code)}</div>
      </div>
      <div class="comp-header-right">
        <div class="meta-field">
          <span class="meta-label">Item Cost ($)</span>
          <input class="meta-input" type="number" min="0" step="0.01"
            value="${comp.itemCost || ''}" placeholder="0.00"
            onchange="updateCompField(${comp.id},'itemCost',parseFloat(this.value)||0)"/>
        </div>
        <div class="meta-field">
          <span class="meta-label">Lead Time (days)</span>
          <input class="meta-input" type="number" min="1"
            value="${comp.leadTimeDays}"
            onchange="updateCompField(${comp.id},'leadTimeDays',parseInt(this.value)||28); renderSidebar();"/>
        </div>
      </div>
    </div>
    <div class="table-outer">
      <table class="mrp-table">
        <thead>
          <tr>
            <th class="col-label sticky-label" style="text-align:left;">Location / Row</th>
            <th class="col-start sticky-start" style="text-align:right;">On Hand</th>
            ${monthCols}
          </tr>
        </thead>
        <tbody>
          ${locBlocks}
          ${allBlock}
        </tbody>
      </table>
    </div>`;
}

function buildLocBlock(loc, comp) {
  // SKUs at this location that use this component
  const locSkus = skus.filter(s => s.locId === loc.id && ((bom[s.id]||{})[comp.id]||0) > 0);
  if (locSkus.length === 0) return ''; // skip locations with no demand

  const startVal = getStart(loc.id, comp.id);
  const ohArr    = runningOnhand(loc.id, comp.id);

  // Location header row
  const startCell = `<input class="start-input" type="number" min="0"
    value="${startVal}" placeholder="0"
    onchange="setStart('${loc.id}',${comp.id},parseFloat(this.value)||0); refreshOnhand('${loc.id}',${comp.id})"/>`;

  let rows = `<tr class="row-loc-head">
    <td class="col-label sticky-label">${esc(loc.name)}</td>
    <td class="col-start sticky-start">${startCell}</td>
    ${MONTHS.map(() => '<td class="col-month"></td>').join('')}
  </tr>`;

  // SKU forecast sub-rows
  locSkus.forEach(sku => {
    const bomQty = (bom[sku.id]||{})[comp.id]||0;
    const cells = MONTHS.map((_, m) => {
      const val = getFc(loc.id, sku.id, m) * bomQty;
      return `<td class="col-month">
        <input class="fc-input" type="number" min="0" value="${val||''}" placeholder="0"
          onchange="setFcComp('${loc.id}',${sku.id},${comp.id},${bomQty},${m},this.value)"/>
      </td>`;
    }).join('');
    // Short SKU label
    const label = sku.name.replace(/^(TMC|OPTIO|WELLSFL|WELLSTX|TPH) - /i,'').replace(/Dispense/i,'').trim();
    rows += `<tr class="row-sku">
      <td class="col-label sticky-label" title="${esc(sku.name)}">${esc(label)}</td>
      <td class="col-start sticky-start"></td>
      ${cells}
    </tr>`;
  });

  // Replenishment row
  const repCells = MONTHS.map((_,m) => {
    const val = getRep(loc.id, comp.id, m);
    return `<td class="col-month">
      <input class="rep-input" type="number" min="0" value="${val||''}" placeholder=""
        onchange="setRep('${loc.id}',${comp.id},${m},parseFloat(this.value)||0); refreshOnhand('${loc.id}',${comp.id})"/>
    </td>`;
  }).join('');
  rows += `<tr class="row-replen">
    <td class="col-label sticky-label">Replenishment</td>
    <td class="col-start sticky-start"></td>
    ${repCells}
  </tr>`;

  // Onhand row
  const ohCells = ohArr.map(v => `<td class="col-month ${valClass(v)}" id="oh-${loc.id}-${comp.id}-${ohArr.indexOf(v)}">${fv(v)}</td>`).join('');
  // (use data attributes for targeted refresh)
  const ohCellsWithId = ohArr.map((v,m) => `<td class="col-month ${valClass(v)}" id="oh-${loc.id}-${comp.id}-${m}">${fv(v)}</td>`).join('');
  rows += `<tr class="row-onhand">
    <td class="col-label sticky-label">On Hand</td>
    <td class="col-start sticky-start"></td>
    ${ohCellsWithId}
  </tr>`;

  // Spacer
  rows += `<tr class="row-spacer"><td class="col-label sticky-label"></td><td class="col-start sticky-start"></td>${MONTHS.map(()=>'<td></td>').join('')}</tr>`;

  return rows;
}

function buildAllBlock(comp) {
  // Aggregate across all locations
  const allLocIds = locations.map(l=>l.id);

  // Total starting inv
  const totalStart = allLocIds.reduce((s,lid)=>s+(Number(getStart(lid,comp.id))||0),0);

  // Per month: total demand, total replen, running onhand
  let oh = totalStart;
  const monthData = MONTHS.map((_,m) => {
    const demand = allLocIds.reduce((s,lid)=>s+compDemand(lid,comp.id,m),0);
    const rep    = allLocIds.reduce((s,lid)=>s+getRep(lid,comp.id,m),0);
    oh = oh - demand + rep;
    return {demand, rep, oh};
  });

  const monthCols = MONTHS.map((mo,m) => `
    <th class="col-month" style="background:#243d5c;color:#93c5fd;font-size:10px;font-weight:700;padding:8px 10px;">${mo.label}</th>`).join('');

  let rows = `<tr class="row-all-head">
    <td class="col-label sticky-label">All Locations</td>
    <td class="col-start sticky-start" style="font-size:13px;font-weight:700;color:#bfdbfe;padding-right:10px;text-align:right;">${totalStart.toLocaleString()||'—'}</td>
    ${MONTHS.map(()=>'<td class="col-month"></td>').join('')}
  </tr>`;

  // Forecast row (total demand)
  rows += `<tr class="row-sku">
    <td class="col-label sticky-label">Forecast</td>
    <td class="col-start sticky-start"></td>
    ${monthData.map(d=>`<td class="col-month">${d.demand?d.demand.toLocaleString():''}</td>`).join('')}
  </tr>`;

  // Replenishment (total)
  rows += `<tr class="row-replen">
    <td class="col-label sticky-label">Replenishment</td>
    <td class="col-start sticky-start"></td>
    ${monthData.map(d=>`<td class="col-month">${d.rep?d.rep.toLocaleString():''}</td>`).join('')}
  </tr>`;

  // Onhand
  rows += `<tr class="row-onhand" style="background:#f0f6ff;">
    <td class="col-label sticky-label" style="background:#f0f6ff;color:#1e40af;">On Hand</td>
    <td class="col-start sticky-start" style="background:#f0f6ff;"></td>
    ${monthData.map(d=>`<td class="col-month ${valClass(d.oh)}" style="${d.oh<0?'background:#fff8f8':'d.oh===0?''':'background:#f0fdf4'}">${fv(d.oh)}</td>`).join('')}
  </tr>`;

  return rows;
}

// ═══════════════════════════════════════════════════
//  Targeted refresh (avoid full re-render on input)
// ═══════════════════════════════════════════════════
function refreshOnhand(locId, compId) {
  const ohArr = runningOnhand(locId, compId);
  ohArr.forEach((v, m) => {
    const cell = document.getElementById(`oh-${locId}-${compId}-${m}`);
    if (cell) {
      cell.textContent = fv(v);
      cell.className = `col-month ${valClass(v)}`;
    }
  });
  renderSidebar(); // update status dots
}

function setFcComp(locId, skuId, compId, bomQty, mIdx, rawVal) {
  const val = (parseFloat(rawVal) || 0) / bomQty;
  setFc(locId, skuId, mIdx, val);
  refreshOnhand(locId, compId);
}

function updateCompField(compId, field, val) {
  const c = components.find(c => c.id === compId);
  if (c) c[field] = val;
}

// ═══════════════════════════════════════════════════
//  Toast helper
// ═══════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 4000);
}

// ═══════════════════════════════════════════════════
//  Inventory file upload
// ═══════════════════════════════════════════════════

// Map inFlow location names → internal locId
// Order matters: more specific patterns first
const LOC_PATTERNS = [
  {patterns: ['optiorx/sbh', 'columbus'],                        id: 'optioColumbus'},
  {patterns: ['optiorx', 'optio ca', 'glendale'],                id: 'optioCA'},
  {patterns: ['tailor made', 'tmc'],                             id: 'TMC'},
  {patterns: ['pharmacy hub', 'tph'],                            id: 'tph'},
  {patterns: ['wells ocala', 'ocala', 'wellsfl', 'wells fl'],    id: 'wellsFL'},
  {patterns: ['wells dallas', 'dallas', 'wellstx', 'wells tx'],  id: 'wellsTX'},
];

function matchLocId(name) {
  const n = (name || '').toLowerCase().trim();
  for (const entry of LOC_PATTERNS) {
    if (entry.patterns.some(p => n.includes(p))) return entry.id;
  }
  return null;
}

function matchCompId(code, name) {
  // Try exact code match
  let c = components.find(c => c.code.toLowerCase() === (code || '').toLowerCase().trim());
  if (c) return c.id;
  // Try partial name match
  if (name) {
    const n = name.toLowerCase().trim();
    c = components.find(c => c.name.toLowerCase() === n);
    if (c) return c.id;
  }
  return null;
}

function handleInventoryUpload(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = ''; // reset so same file can be re-uploaded

  const reader = new FileReader();
  reader.onload = e => {
    try {
      let rows = [];

      if (file.name.toLowerCase().endsWith('.csv')) {
        // CSV path
        const text = new TextDecoder('utf-8').decode(e.target.result).replace(/^\uFEFF/, '');
        const lines = text.split(/\r?\n/);
        const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const vals = lines[i].split(',').map(v => v.replace(/^"|"$/g,'').trim());
          const row = {};
          headers.forEach((h, j) => row[h] = vals[j] || '');
          rows.push(row);
        }
      } else {
        // XLSX path
        const wb = XLSX.read(e.target.result, {type: 'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {defval: ''});
      }

      if (!rows.length) { showToast('No rows found in file', true); return; }

      // Detect column names (case-insensitive)
      const sampleKeys = Object.keys(rows[0]);
      const findCol = (...terms) => sampleKeys.find(k => terms.some(t => k.toLowerCase().includes(t))) || null;

      const colCode     = findCol('sku', 'code', 'item code', 'product code', 'part');
      const colName     = findCol('product name', 'name', 'description', 'item name');
      const colLocation = findCol('location', 'warehouse', 'site', 'facility');
      const colOnHand   = findCol('on hand', 'onhand', 'qty on hand', 'stock', 'available', 'quantity');

      if (!colLocation || !colOnHand) {
        showToast('Could not detect Location and On-Hand columns', true);
        return;
      }

      let matched = 0, skipped = 0;

      rows.forEach(row => {
        const locName  = row[colLocation];
        const rawQty   = row[colOnHand];
        const code     = colCode ? row[colCode] : '';
        const name     = colName ? row[colName] : '';
        const qty      = Math.round(parseFloat(String(rawQty).replace(/,/g, '')) || 0);

        const locId  = matchLocId(locName);
        const compId = matchCompId(code, name);

        if (locId && compId) {
          setStart(locId, compId, qty);
          matched++;
        } else {
          skipped++;
        }
      });

      // Re-render to reflect loaded values
      renderSidebar();
      if (selectedCompId) renderMain();

      showToast(`Loaded ${matched} inventory records${skipped ? ` (${skipped} skipped)` : ''}`);
    } catch (err) {
      console.error(err);
      showToast('Error reading file: ' + err.message, true);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ═══════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════
renderSidebar();
</script>
